[package]
name = "linen-player"
version.workspace = true
edition.workspace = true

[[bin]]
name = "linen"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
log.workspace = true
linen-video.workspace = true
linen-core.workspace = true
libmpv2 = "=7.0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "=0.17.2"
serde_json = "1"
slint = { version = "=1.18.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
env_logger = "0.11"
directories = "6"
raw-window-handle = "0.6"
reqwest = { version = "0.12", features = ["blocking"] }
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }

[build-dependencies]
slint-build = "=1.18.1"
