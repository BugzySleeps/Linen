[workspace]
resolver = "3"
members = ["crates/core", "crates/video", "app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/BugzySleeps/Linen"
homepage = "https://bugzysleeps.github.io/Linen/"

[workspace.dependencies]
linen-video = { path = "crates/video" }
linen-core = { path = "crates/core" }
anyhow = "1"
log = "0.4"

# Linen's own code is optimized even in dev builds (the launcher runs them), with just
# enough debug info for line numbers; dependencies are optimized and carry none.
# Keeps target/ at a few GB instead of tens.
[profile.dev]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
